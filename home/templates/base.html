<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}CodeLANG{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark bg-black px-3">
    <a class="navbar-brand" href="/home/">CodeLANG</a>
    <div>
      <a class="btn btn-sm btn-outline-light" href="/home/">Problems</a>
      <a class="btn btn-sm btn-outline-light" href="{% url 'submission-list' %}">My submissions</a>
      <a class="btn btn-sm btn-outline-danger" href="{% url 'logout-user' %}">Logout</a>
    </div>
  </nav>
  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}info{% endif %}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
