{% extends "base.html" %}
{% block title %}Login - CodeLANG{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="card auth-card" method="post">
    {% csrf_token %}
    <h2>Welcome back</h2>
    <p class="sub">Sign in to keep solving</p>
    <div class="field"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" autofocus required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <button type="submit" class="btn primary block">Sign in</button>
    <p class="auth-alt">New here? <a href="/accounts/register/">Create an account</a><br><a href="/accounts/employee_login/">Employee login</a></p>
  </form>
</div>
{% endblock %}
