{% extends "base.html" %}
{% block title %}Register - CodeLANG{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="card auth-card" method="post">
    {% csrf_token %}
    <h2>Create your account</h2>
    <p class="sub">Free, takes ten seconds</p>
    <div class="field"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" autofocus required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" required></div>
    <button type="submit" class="btn primary block">Register</button>
    <p class="auth-alt">Already registered? <a href="/accounts/login/">Sign in</a></p>
  </form>
</div>
{% endblock %}
