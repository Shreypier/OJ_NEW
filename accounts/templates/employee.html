{% extends "base.html" %}
{% block title %}Employee login - CodeLANG{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="card auth-card" method="post">
    {% csrf_token %}
    <h2>Employee portal</h2>
    <p class="sub">Manage problems and test cases</p>
    <div class="field"><label for="employee_id">Employee ID</label><input type="text" id="employee_id" name="employee_id" autofocus required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <button type="submit" class="btn primary block">Sign in</button>
    <p class="auth-alt"><a href="/accounts/login/">Back to user login</a></p>
  </form>
</div>
{% endblock %}
